<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Respawn Timer</title>

<style>
:root{
  --bg:#0e0f13;
  --card:#17181d;
  --line:rgba(255,255,255,.06);
  --text:#e6e6e6;
  --muted:#9aa0aa;
  --green:#4caf50;
  --orange:#ff9800;
  --yellow:#ffc107;
  --red:#f44336;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}

/* ===== FIXED GLASS HEADER ===== */
header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10;
  backdrop-filter:blur(14px);
  background:rgba(20,22,28,.65);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:12px 14px;
  display:flex;
  gap:10px;
  align-items:center;
}

header h1{
  font-size:15px;
  font-weight:700;
  margin:0;
  letter-spacing:.3px;
}

header input,header select{
  background:#1d1f25;
  border:1px solid var(--line);
  color:var(--text);
  padding:5px 8px;
  border-radius:8px;
  font-size:12px;
}

/* ===== CONTENT ===== */
.app{
  max-width:1100px;
  margin:76px auto 40px;
  padding:0 10px;
}

.section{
  margin-top:18px;
}

.section h2{
  font-size:11px;
  font-weight:700;
  letter-spacing:.6px;
  color:#b0b5c0;
  margin:8px 4px;
}

/* ===== TABLE ===== */
.table{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--line);
}

.row{
  display:grid;
  grid-template-columns:2fr 1fr 1.2fr 1fr;
  padding:8px 12px;
  gap:10px;
  align-items:center;
  font-size:13px;
}

.row.header{
  font-size:11px;
  color:var(--muted);
  background:#14161b;
  font-weight:600;
}

.row:not(.header){
  border-top:1px solid var(--line);
}

.boss-name{
  font-weight:600;
}
.boss-name small{
  display:block;
  font-size:10px;
  color:var(--muted);
}

/* ===== STATUS COLORS (TEXT ONLY) ===== */
.alive{color:var(--green)}
.soon{color:var(--orange)}
.today{color:var(--yellow)}
.scheduled{color:#c36b6b}

.countdown{
  text-align:right;
  font-variant-numeric:tabular-nums;
}

@media(max-width:800px){
  .row{
    grid-template-columns:1fr;
    gap:4px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>Boss Respawn Timer</h1>
    <input id="search" placeholder="Search…">
    <select id="filter">
      <option value="">All</option>
      <option>Alive</option>
      <option>Soon</option>
      <option>Today</option>
      <option>Scheduled</option>
    </select>
  </div>
</header>

<div class="app">
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBbINsazxCJkEHBwySyrQ4FLZhdHC85Cyw",
  authDomain:"boss-respawn-timer.firebaseapp.com",
  projectId:"boss-respawn-timer"
});
const db = getFirestore(app);

/* ===== SAME LOGIC AS BEFORE ===== */

const bosses=[/* SAME BOSS LIST */ 
{n:"Venatus",h:10,l:"Corrupted Basin"},
{n:"Viorent",h:10,l:"Crescent Lake"},
{n:"Lady Dalia",h:18,l:"Twilight Hill"},
{n:"Ego",h:21,l:"Ulan Canyon"},
{n:"Livera",h:24,l:"Protector's Ruins"},
{n:"Araneo",h:24,l:"Lower Tomb of Tyriosa 1F"},
{n:"Undomiel",h:24,l:"Secret Lab"},
{n:"Amentis",h:29,l:"Land of Glory"},
{n:"General Aquleus",h:29,l:"Lower Tomb of Tyriosa 2F"},
{n:"Gareth",h:32,l:"Deadman 1"},
{n:"Baron Braudmore",h:32,l:"Battlefield of Templar"},
{n:"Catena",h:35,l:"Deadman 3"},
{n:"Shuliar",h:35,l:"Ruins of War"},
{n:"Larba",h:35,l:"Ruins of War"},
{n:"Titore",h:37,l:"Deadman 2"},
{n:"Wannitas",h:48,l:"Plateau of Revolution"},
{n:"Metus",h:48,l:"Plateau of Revolution"},
{n:"Duplican",h:48,l:"Plateau of Revolution"},
{n:"Secreta",h:62,l:"Silvergrass Field"},
{n:"Ordo",h:62,l:"Silvergrass Field"},
{n:"Asta",h:62,l:"Silvergrass Field"},
{n:"Supore",h:62,l:"Silvergrass Field"},

{n:"Ringor",ft:["Saturday 17:00"],l:"Battlefield of Templar"},
{n:"Roderick",ft:["Friday 19:00"],l:"Garbana 1"},
{n:"Auraq",ft:["Friday 22:00","Wednesday 21:00"],l:"Garbana 2F"},
{n:"Chaiflock",ft:["Saturday 22:00"],l:"Silvergrass Field"},
{n:"Saphirus",ft:["Sunday 17:00","Tuesday 11:30"],l:"Crescent Lake"},
{n:"Neutro",ft:["Tuesday 19:00","Thursday 11:30"],l:"Desert"},
{n:"Thymele",ft:["Monday 19:00","Wednesday 11:30"],l:"Twilight Hill"},
{n:"Milavy",ft:["Saturday 15:00"],l:"Lower Tomb"},
{n:"Icaruthia",ft:["Tuesday 21:00","Friday 21:00"],l:"Kransia"},
{n:"Motti",ft:["Wednesday 19:00","Saturday 19:00"],l:"Kransia"},
{n:"Nevaeh",ft:["Sunday 22:00"],l:"Kransia"}
];


const data={};
bosses.forEach(async b=>{
  const ref=doc(db,"bosses",b.n);
  if(!(await getDoc(ref)).exists()) await setDoc(ref,{lastKill:0});
  onSnapshot(ref,s=>data[b.n]=s.data());
});

const H24=86400000,H3=10800000;
const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function parseTime(s){
  const [d,t]=s.split(" ");
  const now=new Date();
  const dt=new Date();
  const [h,m]=t.split(":");
  dt.setHours(h,m,0,0);
  let diff=(days.indexOf(d)-now.getDay()+7)%7;
  if(diff===0 && dt<now) diff=7;
  dt.setDate(now.getDate()+diff);
  return dt;
}

function nextSpawn(b){
  if(b.h) return (data[b.n]?.lastKill||0)+b.h*3600000;
  if(b.ft){
    const t=b.ft.map(f=>parseTime(f).getTime()).sort();
    return t.find(x=>x>Date.now())||t[0]+7*H24;
  }
  return Date.now();
}

function timeUntil(b){return nextSpawn(b)-Date.now()}

function status(b){
  const d=timeUntil(b);
  if(d<=0) return ["Alive","alive"];
  if(d<=H3) return ["Soon","soon"];
  if(d<=H24) return ["Today","today"];
  return ["Scheduled","scheduled"];
}

function fmt(b){
  const d=timeUntil(b);
  if(d<=0) return "Now!";
  return `${Math.floor(d/3600000)}h ${Math.floor(d%3600000/60000)}m`;
}

const search=document.getElementById("search");
const filter=document.getElementById("filter");

function render(){
  const root=document.getElementById("list");
  root.innerHTML="";

  const sec=(t,list)=>{
    const s=document.createElement("div");
    s.className="section";
    s.innerHTML=`
      <h2>${t}</h2>
      <div class="table">
        <div class="row header">
          <div>Boss</div><div>Status</div><div>Respawn</div><div class="countdown">Countdown</div>
        </div>
      </div>`;
    const table=s.querySelector(".table");

    list.forEach(b=>{
      const [st,cls]=status(b);
      if(filter.value && filter.value!==st) return;
      if(search.value && !b.n.toLowerCase().includes(search.value.toLowerCase())) return;

      table.innerHTML+=`
      <div class="row">
        <div class="boss-name">${b.n}<small>${b.l}</small></div>
        <div class="${cls}">${st}</div>
        <div>${b.h?`Every ${b.h}h`:b.ft.join(", ")}</div>
        <div class="countdown ${cls}">${fmt(b)}</div>
      </div>`;
    });
    root.appendChild(s);
  };

  const dyn=bosses.filter(b=>!b.ft).sort((a,b)=>timeUntil(a)-timeUntil(b));
  sec("Dynamic Respawns",dyn);
}

render();
setInterval(render,1000);
</script>
</body>
</html>
