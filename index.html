<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<style>

  .legend {
  text-align: center;      /* center text horizontally */
  margin: 0 0 16px 0;      /* optional: add some spacing below */

}

}

<body>
<div class="app">

<header class="floating-header">
  <h1>BOSS RESPAWN TIMER</h1>

    <div id="netStatus" class="net online">ONLINE</div>

  <div class="search-filter">

  </div>
</header>
  <!-- 🔽 EMOJI LEGEND IBUTANG DIRI -->
<div class="legend">
  ⚔️ TK MAIN &nbsp; | &nbsp;
  🛡️ ALLIANCE &nbsp; 
</div>

<div id="list"></div>

</div>

  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc,
  enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== Firebase config =====
const app = initializeApp({
  apiKey:"AIzaSyBbINsazxCJkEHBwySyrQ4FLZhdHC85Cyw",
  authDomain:"boss-respawn-timer.firebaseapp.com",
  projectId:"boss-respawn-timer",
  storageBucket: "boss-respawn-timer.firebasestorage.app",
  messagingSenderId: "767083470052",
  appId: "1:767083470052:web:17d7453fe66700321760f1",
  measurementId: "G-KPH3R4MRBZ"
});
const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(err => {
  console.warn("Offline persistence error:", err.code);
});

  // ===== GLOBAL DAYS (ONLY ONE) =====
const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_TULISAN = {
  Monday:    { emoji:"", name:"" },
  Tuesday:   { emoji:"", name:"" },
  Wednesday: { emoji:"", name:"" },
  Thursday:  { emoji:"", name:"" },
  Friday:    { emoji:"", name:"" },
  Saturday:  { emoji:"", name:"" },
  Sunday:    { emoji:"", name:"" }
};

function getTodayTulugan(){
  const today = days[new Date().getDay()];

}




  
// ===========================
// 🔒 ADMIN HASH 
const ADMIN_HASH = "e0eafba05e56420e4b0f7a8297a3822871e36348972d73b4661fcde3018d8dda";
let isAdmin = false;

async function checkAdmin(){
  if(new URLSearchParams(location.search).get("admin") !== "1") return;


  const input = prompt("Enter admin code:");
  if(!input) return;

  const enc = new TextEncoder().encode(input);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  const hash = Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

  if(hash === ADMIN_HASH){
    isAdmin = true;
    console.log("✅ ADMIN MODE");
  }else{
    alert("❌ Invalid admin code");
  }
}


  const GUILD_MAP = {
  "ALLIANCE": [
    "Venatus","Viorent","Ego","Clemantis","Livera","Araneo",
    "Undomiel","Saphirus","Neutro","Lady Dalia","General Aquleus",
    "Thymele","Amentis","Baron Braudmore"
  ],
  "TK MAIN": [
    "Milavy","Wannitas","Metus","Duplican","Shuliar","Ringor",
    "Roderick","Gareth","Titore","Larba","Catena","Auraq",
    "Secreta","Ordo","Asta","Supore","Chaiflock","Benji",
    "Icaruthia","Motti","Nevaeh","Tumier"
  ]
};

  
  
// Boss list
let bosses = [];

fetch("data.json")
.then(r => r.json())
.then(d => {
  bosses = [...d.hourly, ...d.fixed];
  render();
});




  
  // 🔥 FIRESTORE LOCAL CACHE
  const data = {};
  const resetAllBtn = document.getElementById("resetAllBtn");

(async () => {
  await checkAdmin();

  // Show reset button for admin
  if(isAdmin && resetAllBtn){
    resetAllBtn.style.display="inline-block";
    resetAllBtn.onclick = async ()=>{
      if(!confirm("RESET ALL BOSSES?")) return;
      for(const b of bosses){
        await updateDoc(doc(db,"bosses",b.n),{lastKill:0});
      }
      alert("All bosses reset.");
      render();
    };
  }

  // Initialize Firestore for all bosses
  for(const b of bosses){
    try{
      const ref = doc(db,"bosses",b.n);
      const snap = await getDoc(ref);
      if(!snap.exists() && isAdmin){
        await setDoc(ref,{lastKill:0,ft:b.ft||[],h:b.h||0,l:b.l||"-"});
      }
      onSnapshot(ref, s => {
        data[b.n] = s.data();
        render();
      });
    }catch(e){
      console.warn("Firestore read error (ignored):", e.message);
    }
  }

  render(); // initial render
})();


  

// Timer logic
function parseTime(str){
  const [day,time] = str.split(" ");
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  const now = new Date();
  const t = new Date(); t.setHours(...time.split(":").map(Number),0,0);
  let diff = (days.indexOf(day)-now.getDay()+7)%7;
  if(diff===0 && t<now) diff=7;
  t.setDate(now.getDate()+diff);
  return t;
}

function nextSpawn(b, lastKillOverride) {
  // HOURLY BOSSES
  if (b.h) {
    const lastKill = lastKillOverride ?? (data[b.n]?.lastKill || 0);
    return lastKill + b.h * 3600000;
  }

  // FIXED-TIME BOSSES
  if (b.ft) {
    const now = Date.now();

    // get all upcoming times
    const upcoming = b.ft
      .map(f => parseTime(f).getTime())
      .filter(t => t > now)
      .sort((a, b) => a - b);

    if (upcoming.length) return upcoming[0];

    // else, get earliest next week
    const nextWeek = b.ft
      .map(f => parseTime(f).getTime() + 7 * 24 * 3600000)
      .sort((a, b) => a - b);

    return nextWeek[0];
  }

  return Date.now();
}
  

  --------------------------------------------------------------------
  

function formatCountdown(b){
  const diff = nextSpawn(b) ? nextSpawn(b)-Date.now() : -1;
  if(diff <=0) return "ALIVE";
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  return `${h}h ${m}m`;
}

  
  
// Admin actions
window.killBoss = async (bossName) => {
  if (!isAdmin) return;
  try {
    let input = prompt("Enter exact kill time (YYYY-MM-DD HH:MM) or leave blank for current time:");
    let time = Date.now();
    if (input) {
      const d = new Date(input);
      if (!isNaN(d)) time = d.getTime();
    }
const boss = bosses.find(b => b.n === bossName);
const respawnTime = nextSpawn(boss, time);  // 'time' gikan sa admin prompt

console.log("===== BOSS LOG =====");
console.log("Boss:", bossName);
console.log("Killed at:", new Date(time).toLocaleString());
console.log("Respawns at:", new Date(respawnTime).toLocaleString());
console.log("====================");

const bossRef = doc(db, "bosses", bossName);
const current = data[bossName] || {};

let logs = current.logs || [];

// add new log sa pinaka taas
logs.unshift({
  killedAt: time,
  respawnAt: respawnTime
});

// keep only last 5 logs
logs = logs.slice(0,5);

await updateDoc(bossRef, {
  lastKill: time,
  lastRespawn: respawnTime,
  logs: logs
});


    alert(
  `✅ ${bossName} Updated!\n\n` +
  `🗡️ Killed At:\n${new Date(time).toLocaleString()}\n\n` +
  `⏳ Respawns At:\n${new Date(respawnTime).toLocaleString()}`
);

    render(); // refresh UI immediately
  } catch(e) {
    console.error("Failed to update boss:", e);
    alert("Error updating boss. Check console for details.");
  }
};

  window.viewLogs = (bossName) => {
  const bossData = data[bossName];
  if(!bossData || !bossData.logs || bossData.logs.length === 0){
    alert("No logs yet for " + bossName);
    return;
  }

  let msg = `📜 Last 5 Logs for ${bossName}\n\n`;

  bossData.logs.forEach((log, i) => {
    msg += `#${i+1}\n`;
    msg += `🗡️ Killed: ${new Date(log.killedAt).toLocaleString()}\n`;
    msg += `⏳ Respawn: ${new Date(log.respawnAt).toLocaleString()}\n\n`;
  });

  alert(msg);
};

  
window.resetBoss = async (bossName) => {
  if (!isAdmin) {
    alert("You are not admin!");
    return;
  }

  if (confirm("Reset boss last kill?")) {
    try {
      await updateDoc(doc(db, "bosses", bossName), {
        lastKill: 0,
      });
      alert(`${bossName} reset!`);
      render(); // refresh UI immediately
    } catch (e) {
      console.error("Failed to reset boss:", e);
      alert("Error: cannot reset boss. Check Firestore rules!");
    }
  }
};

// Search/filter
const searchInput=document.getElementById('search');
const filterSelect=document.getElementById('filter');
searchInput.addEventListener('input', render);
filterSelect.addEventListener('change', render);



  
  
// Render

function getBossGuild(bossName){
  if(GUILD_MAP.ALLIANCE.includes(bossName)) return "ALLIANCE";
  if(GUILD_MAP["TK MAIN"].includes(bossName)) return "TK MAIN";
  return "ALL";
}

function getBossEmoji(b){
  const guild = getBossGuild(b.n);
  if(guild === "TK MAIN") return "⚔️";
  if(guild === "ALLIANCE") return "🛡️";
  return "⚔️";
}




 
  const ONE_HOUR = 60 * 60 * 1000;
  const FOUR_HOURS = 4 * ONE_HOUR;
  const TWENTY_FOUR_HOURS = 24 * ONE_HOUR;
  
function isFixedBoss(b){
  return Array.isArray(b.ft) && b.ft.length > 0;
}

function isTodayFixedBoss(b){
  if(!isFixedBoss(b)) return false;
  const today = days[new Date().getDay()];
  return b.ft.some(f => f.startsWith(today));
}
  
function isKransiaBoss(b){
  return b.l === "Kransia";
}

function isFixedRespawnToday(b){
  if(!isFixedBoss(b)) return false;
  const today = days[new Date().getDay()];
  if(!b.ft.some(f => f.startsWith(today))) return false;

  // kinahanglan ≤ 24h nalang
  return timeUntilSpawn(b) > 0 && timeUntilSpawn(b) <= TWENTY_FOUR_HOURS;
}


function render(){
  const root = document.getElementById("list");
  root.innerHTML = "";

const todayFixed = [];
const dynamic = [];
const otherFixed = [];
const kransia = [];

bosses.forEach(b=>{
  if(isKransiaBoss(b)){
    kransia.push(b);
  }
  else if(isFixedRespawnToday(b)){
    todayFixed.push(b);
  }
  else if(isFixedBoss(b)){
    otherFixed.push(b);
  }
  else{
    dynamic.push(b);
  }
});


  const TWELVE_HOURS = 12 * 60 * 60 * 1000;

function sortByPriority(list){
  return list.sort((a,b)=>{
    const ta = timeUntilSpawn(a);
    const tb = timeUntilSpawn(b);

    const aSoon = ta > 0 && ta <= TWELVE_HOURS;
    const bSoon = tb > 0 && tb <= TWELVE_HOURS;

    if(aSoon && !bSoon) return -1;
    if(!aSoon && bSoon) return 1;

    return ta - tb; // soonest first
  });
}

if(todayFixed.length)
  root.appendChild(renderSection("FIXED RESPAWNS TODAY", sortByPriority(todayFixed)));

function sortDynamicBosses(list){
  return list.sort((a,b)=>{
    const ta = timeUntilSpawn(a);
    const tb = timeUntilSpawn(b);

    // Alive first
    if(ta <= 0 && tb > 0) return -1;
    if(tb <= 0 && ta > 0) return 1;

    // Almost respawning (within 24h)
    const aSoon = ta > 0 && ta <= TWENTY_FOUR_HOURS;
    const bSoon = tb > 0 && tb <= TWENTY_FOUR_HOURS;

    if(aSoon && !bSoon) return -1;
    if(!aSoon && bSoon) return 1;

    // Otherwise soonest first
    return ta - tb;
  });
}

  function sortKransia(list){
  const order = ["Motti","Icaruthia","Nevaeh"];
  return list.sort((a,b)=> order.indexOf(a.n) - order.indexOf(b.n));
}

if(dynamic.length)
  root.appendChild(
    renderSection("DYNAMIC BOSSES", sortDynamicBosses(dynamic))
  );


if(otherFixed.length)
  root.appendChild(renderSection("OTHER FIXED TIMER", sortByPriority(otherFixed)));


 if(kransia.length)
  root.appendChild(
    renderSection("KRANSIA", kransia)
  );
}

  function formatRespawnDate(ts){
  if(!ts) return "ALIVE";
  const d = new Date(ts);
  return d.toLocaleString(undefined,{
    month:"short",
    day:"numeric",
    weekday:"short",
    hour:"numeric",
    minute:"2-digit",
    hour12:true
  });
}

  function renderSection(title, list){
  const sec = document.createElement("div");
  sec.className = "section";

  sec.innerHTML = `
    <h2>${title}</h2>
    <div class="boss" style="font-size:12px;font-weight:600;color:#9aa0aa">
      <div>Boss</div>
      <div>Status</div>
      <div>Respawn</div>
      <div>Countdown</div>
      ${isAdmin ? "<div>Actions</div>" : ""}
    </div>
  `;

  list.forEach(b=>{
    const [t,cls,col] = getStatus(b);
    const selectedGuild = filterSelect.value;
const bossGuild = getBossGuild(b.n);

if(selectedGuild !== "ALL" && bossGuild !== selectedGuild) return;

    if(searchInput.value && !b.n.toLowerCase().includes(searchInput.value.toLowerCase())) return;

    sec.innerHTML += `
      <div class="boss ${cls}">
        <div>
          <strong>${getBossEmoji(b)} ${b.n}</strong>
          <small>${b.l}</small>
        </div>
        <div class="status">
          <span class="dot" style="background:${col}"></span>${t}
        </div>
        <div class="schedule">
  ${
    b.h
    ? `${formatRespawnDate(nextSpawn(b))} <span class="respawn-rule">· ⏳${b.h}h</span>`
    : `📌 ${formatRespawnDate(nextSpawn(b))}`
  }
</div>


        <div class="time">${formatCountdown(b)}</div>
        ${isAdmin ? `
        <div>
          <button onclick="killBoss('${b.n}')">Kill</button>
          <button onclick="viewLogs('${b.n}')">Logs</button>
          <button onclick="resetBoss('${b.n}')">Reset</button>
        </div>` : ""}
      </div>
    `;
  });

  return sec;
}



setInterval(render, 1000);


  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const newWorker = reg.installing;
      newWorker.addEventListener("statechange", () => {
        if (
          newWorker.state === "installed" &&
          navigator.serviceWorker.controller
        ) {
          location.reload(); // 🔥 AUTO REFRESH
        }
      });
    });
  });
}

// === NETWORK STATUS INDICATOR ===
const net = document.getElementById("netStatus");

function updateNetwork(){
  if(!net) return;

  if(navigator.onLine){
    net.textContent = "ONLINE";
    net.className = "net online";
  }else{
    net.textContent = "OFFLINE";
    net.className = "net offline";
  }
}


window.addEventListener("online", updateNetwork);
window.addEventListener("offline", updateNetwork);
updateNetwork();


  
  
// ======= DESKTOP NOTIFICATIONS & ALARMS =======
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission().then(p => {
    if(p !== "granted") console.log("Notifications blocked");
  });
}

const alertTimes = [60, 10]; // minutes before respawn: 60min and 10min
const notified = {}; // keep track so we don't spam notifications

function scheduleBossAlerts(boss){
  const now = Date.now();
  const respawn = nextSpawn(boss);

  alertTimes.forEach(minBefore => {
    const alertKey = `${boss.n}-${minBefore}`;
    
    // only schedule if not notified yet AND respawn is in the future
    if(notified[alertKey] || respawn - minBefore*60*1000 <= now) return;
    notified[alertKey] = true; // mark immediately to prevent rescheduling

    const delay = respawn - minBefore*60*1000 - now;
    if(delay <= 0) return;

    setTimeout(() => {
      // create notification
      let notif;
      if(Notification.permission === "granted"){
        notif = new Notification(`⚔️ ${boss.n} respawning in ${minBefore} min!`, {
          body: `Location: ${boss.l}`,
          icon: "https://example.com/boss-icon.png" // optional icon
        });

        // close notification after 1 minute (60000ms)
        setTimeout(() => notif.close(), 60*1000);
      }

      // play short sound for 10 seconds
      const audio = new Audio("https://freesound.org/data/previews/316/316847_4939433-lq.mp3");
      audio.play().catch(()=>{});
      setTimeout(() => { audio.pause(); audio.currentTime = 0; }, 10000);

    }, delay);
  });
}

// Run once on page load
bosses.forEach(b => scheduleBossAlerts(b));

  const t = getTodayTulugan();
const todayBox = document.querySelector(".today-tulugan");
if(todayBox){
  todayBox.innerHTML = `Today: ${t.emoji} ${t.name}`;
}


// Optional: reschedule only for future bosses every 5 minutes
setInterval(() => {
  bosses.forEach(b => scheduleBossAlerts(b));
}, 5 * 60 * 1000); // every 5 minutes

  
</script>
