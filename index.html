<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Respawn Timer</title>

<style>
:root{
  --bg:#0e0f13;
  --card:#17181d;
  --line:rgba(255,255,255,.06);
  --text:#e6e6e6;
  --muted:#9aa0aa;
  --green:#4caf50;
  --orange:#ff9800;
  --yellow:#ffc107;
  --red:#f44336;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:var(--bg);
  color:var(--text);
}

/* ===== FIXED GLASS HEADER ===== */
header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  backdrop-filter:blur(14px);
  background:rgba(20,22,28,.65);
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

header h1{
  font-size:15px;
  font-weight:700;
  margin:0;
  letter-spacing:.3px;
}

/* ===== CONTENT ===== */
.app{
  max-width:1100px;
  margin:70px auto 40px;
  padding:0 10px;
}

.section{
  margin-top:18px;
}

.section h2{
  font-size:11px;
  font-weight:700;
  letter-spacing:.6px;
  color:#b0b5c0;
  margin:8px 4px;
}

/* ===== TABLE ===== */
.table{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--line);
}

.row{
  display:grid;
  grid-template-columns:2fr 1fr 1.2fr 1fr;
  padding:8px 12px;
  gap:10px;
  align-items:center;
  font-size:13px;
}

.row.header{
  font-size:11px;
  color:var(--muted);
  background:#14161b;
  font-weight:600;
}

.row:not(.header){
  border-top:1px solid var(--line);
}

.boss-name{font-weight:600}
.boss-name small{
  display:block;
  font-size:10px;
  color:var(--muted);
}

/* STATUS TEXT COLORS */
.alive{color:var(--green)}
.soon{color:var(--orange)}
.today{color:var(--yellow)}
.scheduled{color:#c36b6b}

.countdown{
  text-align:right;
  font-variant-numeric:tabular-nums;
}

@media(max-width:800px){
  .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>Boss Respawn Timer</h1>
  </div>
</header>

<div class="app">
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* === FIREBASE (UNCHANGED) === */
const app = initializeApp({
  apiKey:"AIzaSyBbINsazxCJkEHBwySyrQ4FLZhdHC85Cyw",
  authDomain:"boss-respawn-timer.firebaseapp.com",
  projectId:"boss-respawn-timer"
});
const db = getFirestore(app);

/* === ORIGINAL BOSS LIST (100% SAME ORDER) === */
const bosses = [
  {n:"Venatus",h:10,l:"Corrupted Basin"},
  {n:"Viorent",h:10,l:"Crescent Lake"},
  {n:"Lady Dalia",h:18,l:"Twilight Hill"},
  {n:"Ego",h:21,l:"Ulan Canyon"},
  {n:"Livera",h:24,l:"Protector's Ruins"},
  {n:"Araneo",h:24,l:"Lower Tomb of Tyriosa 1F"},
  {n:"Undomiel",h:24,l:"Secret Lab"}
];

/* === FIRESTORE INIT === */
const data={};
bosses.forEach(async b=>{
  const ref=doc(db,"bosses",b.n);
  if(!(await getDoc(ref)).exists()) await setDoc(ref,{lastKill:0});
  onSnapshot(ref,s=>data[b.n]=s.data());
});

const H24=86400000, H3=10800000;

function nextSpawn(b){
  return (data[b.n]?.lastKill||0)+b.h*3600000;
}

function timeUntil(b){return nextSpawn(b)-Date.now()}

function status(b){
  const d=timeUntil(b);
  if(d<=0) return ["Alive","alive"];
  if(d<=H3) return ["Soon","soon"];
  if(d<=H24) return ["Today","today"];
  return ["Scheduled","scheduled"];
}

function fmt(b){
  const d=timeUntil(b);
  if(d<=0) return "Now!";
  return `${Math.floor(d/3600000)}h ${Math.floor(d%3600000/60000)}m`;
}

function render(){
  const root=document.getElementById("list");
  root.innerHTML="";

  const sec=document.createElement("div");
  sec.className="section";
  sec.innerHTML=`
    <h2>DYNAMIC BOSSES</h2>
    <div class="table">
      <div class="row header">
        <div>Boss</div><div>Status</div><div>Respawn</div><div class="countdown">Countdown</div>
      </div>
    </div>`;
  const table=sec.querySelector(".table");

  bosses.forEach(b=>{
    const [st,cls]=status(b);
    table.innerHTML+=`
      <div class="row">
        <div class="boss-name">${b.n}<small>${b.l}</small></div>
        <div class="${cls}">${st}</div>
        <div>Every ${b.h}h</div>
        <div class="countdown ${cls}">${fmt(b)}</div>
      </div>`;
  });

  root.appendChild(sec);
}

render();
setInterval(render,1000);
</script>
</body>
</html>
