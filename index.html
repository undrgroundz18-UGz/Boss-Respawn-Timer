<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Respawn Timer</title>

<style>
body {
  font-family: system-ui, Arial, sans-serif;
  background: #111;
  color: #eee;
  padding: 18px 8px;
}

.app {
  max-width: 1000px;
  margin: auto;
  background: #1b1c1f;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
}

h1 {
  text-align: center;
  margin-bottom: 18px;
  font-size: 20px;
}

.search-filter {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

input, select, button {
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.15);
  background: #212327;
  color: #eee;
}

.section {
  margin-top: 18px;
}

.section h2 {
  font-size: 11px;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.boss {
  display: grid;
  grid-template-columns: 1.6fr .8fr .9fr .9fr auto;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  align-items: center;
  background: linear-gradient(90deg, rgba(40,40,40,0.9), rgba(28,28,28,0.9));
}

.boss.alive { border-left: 4px solid #4caf50; }
.boss.soon { border-left: 4px solid #ff9800; }
.boss.today { border-left: 4px solid #ffc107; }
.boss.scheduled { border-left: 4px solid #f44336; }

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

@media(max-width:900px){
  .boss { grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="app">
<h1>Boss Respawn Timer</h1>

<div class="search-filter">
  <input id="search" placeholder="Search boss...">
  <select id="filter">
    <option value="">All Status</option>
    <option value="Alive">Alive</option>
    <option value="Soon">Soon</option>
    <option value="Today">Today</option>
    <option value="Scheduled">Scheduled</option>
  </select>
  <button id="resetAllBtn" style="display:none">Reset All</button>
</div>

<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyBbINsazxCJkEHBwySyrQ4FLZhdHC85Cyw",
  authDomain:"boss-respawn-timer.firebaseapp.com",
  projectId:"boss-respawn-timer"
});
const db = getFirestore(app);

let isAdmin=false;
if(new URLSearchParams(location.search).get("admin")==="1"){
  if(prompt("Admin password")==="UGzAdmin") isAdmin=true;
}

const bosses=[/* SAME BOSS LIST */ 
{n:"Venatus",h:10,l:"Corrupted Basin"},
{n:"Viorent",h:10,l:"Crescent Lake"},
{n:"Livera",h:24,l:"Protector's Ruins"},
{n:"Araneo",h:24,l:"Lower Tomb of Tyriosa 1F"},
{n:"Undomiel",h:24,l:"Secret Lab"},
{n:"Lady Dalia",h:18,l:"Twilight Hill"},
{n:"Ego",h:21,l:"Ulan Canyon"},
{n:"Amentis",h:29,l:"Land of Glory"},
{n:"General Aquleus",h:29,l:"Lower Tomb of Tyriosa 2F"},
{n:"Gareth",h:32,l:"Deadman 1"},
{n:"Baron Braudmore",h:32,l:"Battlefield of Templar"},
{n:"Catena",h:35,l:"Deadman 3"},
{n:"Shuliar",h:35,l:"Ruins of War"},
{n:"Larba",h:35,l:"Ruins of War"},
{n:"Titore",h:37,l:"Deadman 2"},
{n:"Wannitas",h:48,l:"Plateau of Revolution"},
{n:"Metus",h:48,l:"Plateau of Revolution"},
{n:"Duplican",h:48,l:"Plateau of Revolution"},
{n:"Secreta",h:62,l:"Silvergrass Field"},
{n:"Ordo",h:62,l:"Silvergrass Field"},
{n:"Asta",h:62,l:"Silvergrass Field"},
{n:"Supore",h:62,l:"Silvergrass Field"},

{n:"Ringor",ft:["Saturday 17:00"],l:"Battlefield of Templar"},
{n:"Roderick",ft:["Friday 19:00"],l:"Garbana 1"},
{n:"Auraq",ft:["Friday 22:00","Wednesday 21:00"],l:"Garbana 2F"},
{n:"Chaiflock",ft:["Saturday 22:00"],l:"Silvergrass Field"},
{n:"Saphirus",ft:["Sunday 17:00","Tuesday 11:30"],l:"Crescent Lake"},
{n:"Neutro",ft:["Tuesday 19:00","Thursday 11:30"],l:"Desert"},
{n:"Thymele",ft:["Monday 19:00","Wednesday 11:30"],l:"Twilight Hill"},
{n:"Milavy",ft:["Saturday 15:00"],l:"Lower Tomb"},
{n:"Icaruthia",ft:["Tuesday 21:00","Friday 21:00"],l:"Kransia"},
{n:"Motti",ft:["Wednesday 19:00","Saturday 19:00"],l:"Kransia"},
{n:"Nevaeh",ft:["Sunday 22:00"],l:"Kransia"}
];

const data={};
bosses.forEach(async b=>{
  const ref=doc(db,"bosses",b.n);
  if(!(await getDoc(ref)).exists())
    await setDoc(ref,{lastKill:0});
  onSnapshot(ref,s=>data[b.n]=s.data());
});

const H24=24*60*60*1000;
const H3=3*60*60*1000;
const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function parseTime(str){
  const [d,t]=str.split(" ");
  const now=new Date();
  const dt=new Date();
  const [h,m]=t.split(":");
  dt.setHours(h,m,0,0);
  let diff=(days.indexOf(d)-now.getDay()+7)%7;
  if(diff===0 && dt<now) diff=7;
  dt.setDate(now.getDate()+diff);
  return dt;
}

function nextSpawn(b){
  if(b.h) return (data[b.n]?.lastKill||0)+b.h*3600000;
  if(b.ft){
    const t=b.ft.map(f=>parseTime(f).getTime()).sort();
    return t.find(x=>x>Date.now())||t[0]+7*H24;
  }
  return Date.now();
}

function timeUntilSpawn(b){ return nextSpawn(b)-Date.now(); }

function getStatus(b){
  const d=timeUntilSpawn(b);
  if(d<=0) return ["Alive","alive","#4caf50"];
  if(d<=H3) return ["Soon","soon","#ff9800"];
  if(d<=H24) return ["Today","today","#ffc107"];
  return ["Scheduled","scheduled","#f44336"];
}

function formatCountdown(b){
  const d=timeUntilSpawn(b);
  if(d<=0) return "Alive";
  return `${Math.floor(d/3600000)}h ${Math.floor(d%3600000/60000)}m`;
}

function render(){
  const root=document.getElementById("list");
  root.innerHTML="";

  const todayFixed=[],dynamic=[],otherFixed=[],kransia=[];
  bosses.forEach(b=>{
    if(b.l==="Kransia") kransia.push(b);
    else if(b.ft && b.ft.some(f=>f.startsWith(days[new Date().getDay()])) && timeUntilSpawn(b)<=H24)
      todayFixed.push(b);
    else if(b.ft) otherFixed.push(b);
    else dynamic.push(b);
  });

  dynamic.sort((a,b)=>timeUntilSpawn(a)-timeUntilSpawn(b));
  kransia.sort((a,b)=>["Motti","Icaruthia","Nevaeh"].indexOf(a.n)-["Motti","Icaruthia","Nevaeh"].indexOf(b.n));

  const renderSec=(t,l)=>{
    const s=document.createElement("div");
    s.className="section";
    s.innerHTML=`<h2>${t}</h2>`;
    l.forEach(b=>{
      const [st,cl,col]=getStatus(b);
      s.innerHTML+=`
      <div class="boss ${cl}">
        <div><b>${b.n}</b><br><small>${b.l}</small></div>
        <div><span class="dot" style="background:${col}"></span> ${st}</div>
        <div>${b.h?`Every ${b.h}h`:b.ft.join(", ")}</div>
        <div>${formatCountdown(b)}</div>
      </div>`;
    });
    root.appendChild(s);
  };

  if(todayFixed.length) renderSec("FIXED RESPAWN TODAY",todayFixed);
  if(dynamic.length) renderSec("DYNAMIC BOSSES",dynamic);
  if(otherFixed.length) renderSec("OTHER FIXED TIMER",otherFixed);
  if(kransia.length) renderSec("KRANSIA BOSS",kransia);
}

render();
setInterval(render,1000);
</script>
</body>
</html>
