<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Respawn Timer</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111">

<style>

  .legend {
  text-align: center;      /* center text horizontally */
  margin: 0 0 16px 0;      /* optional: add some spacing below */
  font-size: 14px;         /* optional: adjust font size */
  color: #ccc;             /* optional: lighter color to match theme */
}

  
.boss.very-soon{
  border-left: 4px solid #ff5252;
}

.very-soon{
  color: #ff5252 !important;
}

  
/* compact look */
header h1{
  font-size: 1.2rem;
  margin: 0;
}

/* color warning when near respawn */
.soon{
  color: #ffb347 !important;
}
.now{
  color: #4cff4c !important;
}

body {
  font-family: system-ui, Arial, sans-serif;
  background: #111;
  color: #eee;
  padding: 18px 8px;
}

.app {
  max-width: 1000px;
  margin: auto;
  background: #1b1c1f;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .8);
}

h1 {
  text-align: center;
  margin-bottom: 18px;
  font-size: 20px;
  color: #fff;
}

.search-filter{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap: wrap;
}

  .schedule{
  font-size:12px;
  font-weight:600;
  color:#ddd;
  white-space:nowrap;
}

.respawn-rule{
  color:#ffb347;
  font-weight:700;
  margin-left:4px;
}


input, select, button {
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.15);
  background: #212327;
  color: #eee;
}

  .search-filter input,
.search-filter select,
.search-filter button{
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  color:#fff;
}


button:hover {
  opacity: .87;
}

.section {
  margin-top: 18px;
}

.section h2 {
  font-size: 11px;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.boss {
  display: grid;
  grid-template-columns: 1.6fr .8fr .9fr .9fr auto;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  align-items: center;
  background: linear-gradient(90deg, rgba(40,40,40,0.9), rgba(28,28,28,0.9));
}

.boss-name strong {
  font-size: 14px;
}

.boss-name small {
  display: block;
  font-size: 10px;
  color: #999;
  margin-top: 2px;
}

.status {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
  font-size: 12px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

.time, .schedule {
  font-size: 13px;
  font-weight: 600;
}

.boss.alive {
  border-left: 4px solid #4caf50;
}
.boss.soon {
  border-left: 4px solid #ff9800;
}
.boss.today {
  border-left: 4px solid #ffc107;
}
.boss.scheduled {
  border-left: 4px solid #9e9e9e;
}

@media(max-width:900px){
  .boss {
    grid-template-columns:1fr;
    gap:6px;
  }
}

  .net{
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  padding: 4px 10px;
  border-radius: 999px;
  width: fit-content;
  margin: 0 auto 8px;
  letter-spacing: .12em;
}

.net.online{
  background: rgba(76,175,80,.15);
  color: #4caf50;
  border: 1px solid rgba(76,175,80,.35);
}

.net.offline{
  background: rgba(244,67,54,.15);
  color: #f44336;
  border: 1px solid rgba(244,67,54,.35);
}


  /* === FLOATING GLASS HEADER === */
.floating-header{
  position: sticky;
  top: 0;
  z-index: 999;

  background: rgba(20,20,25,.55);
  backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid rgba(255,255,255,.06);


  padding: 10px 14px 12px;
  margin-bottom: 14px;

  border-bottom: 1px solid rgba(255,255,255,.08);
}


.floating-header h1{
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  letter-spacing: .12em;
}


/* smooth color transitions */
.boss{
  transition: border-color .4s ease, background .4s ease;
}

.time, .status, .boss-name strong{
  transition: color .4s ease;
}

/* subtle pulse for alive */
.boss.alive{
  animation: alivePulse 2.5s ease-in-out infinite;
}

@keyframes alivePulse{
  0%{ box-shadow: 0 0 0 rgba(76,175,80,0); }
  50%{ box-shadow: 0 0 14px rgba(76,175,80,.25); }
  100%{ box-shadow: 0 0 0 rgba(76,175,80,0); }
}

</style>

</head>
<body>
<div class="app">

<header class="floating-header">
  <h1>BOSS RESPAWN TIMER</h1>

    <div id="netStatus" class="net online">ONLINE</div>

  <div class="search-filter">
    <input id="search" type="text" placeholder="Search boss...">
    <select id="filter">
      <option value="">All Statuses</option>
      <option value="Alive">Alive</option>
      <option value="Very Soon">Very Soon</option>
      <option value="Soon">Soon</option>
      <option value="Today">Today</option>
      <option value="Scheduled">Scheduled</option>
    </select>
    <button id="resetAllBtn" style="display:none">Reset All</button>
  </div>
</header>
  <!-- 🔽 EMOJI LEGEND IBUTANG DIRI -->
<div class="legend">
  ⚔️  TULISAN 1 &nbsp; | &nbsp;
  🛡️  TULISAN 2 &nbsp; | &nbsp;
  🔥  TULISAN 3 &nbsp; | &nbsp;
  🌟  TULISAN 4 &nbsp; | &nbsp;
  ⭐  TULISAN 5
</div>

<div id="list"></div>

</div>

  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc,
  enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== Firebase config =====
const app = initializeApp({
  apiKey:"AIzaSyBbINsazxCJkEHBwySyrQ4FLZhdHC85Cyw",
  authDomain:"boss-respawn-timer.firebaseapp.com",
  projectId:"boss-respawn-timer",
  storageBucket: "boss-respawn-timer.firebasestorage.app",
  messagingSenderId: "767083470052",
  appId: "1:767083470052:web:17d7453fe66700321760f1",
  measurementId: "G-KPH3R4MRBZ"
});
const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(err => {
  console.warn("Offline persistence error:", err.code);
});

// ===========================

// Admin mode
let isAdmin = false;
if(new URLSearchParams(location.search).get("admin")==="1"){
  if(prompt("Enter admin password:")==="UGzAdmin") isAdmin=true;
}


  
// Boss list
const bosses = [
  // Hourly bosses
  
  {n:"Venatus",h:10,l:"Corrupted Basin"},
  {n:"Viorent",h:10,l:"Crescent Lake"},
  {n:"Livera",h:24,l:"Protector's Ruins"},
  {n:"Araneo",h:24,l:"Lower Tomb of Tyriosa 1F"},
  {n:"Undomiel",h:24,l:"Secret Lab"},
  {n:"Lady Dalia",h:18,l:"Twilight Hill"},
  {n:"Ego",h:21,l:"Ulan Canyon"},
  {n:"Amentis",h:29,l:"Land of Glory"},
  {n:"General Aquleus",h:29,l:"Lower Tomb of Tyriosa 2F"},
  {n:"Gareth",h:32,l:"Deadman 1"},
  {n:"Baron Braudmore",h:32,l:"Battlefield of Templar"},
  {n:"Catena",h:35,l:"Deadman 3"},
  {n:"Shuliar",h:35,l:"Ruins of War"},
  {n:"Larba",h:35,l:"Ruins of War"},
  {n:"Titore",h:37,l:"Deadman 2"},
  {n:"Wannitas",h:48,l:"Plateau of Revolution"},
  {n:"Metus",h:48,l:"Plateau of Revolution"},
  {n:"Duplican",h:48,l:"Plateau of Revolution"},
  {n:"Secreta",h:62,l:"Silvergrass Field"},
  {n:"Ordo",h:62,l:"Silvergrass Field"},
  {n:"Asta",h:62,l:"Silvergrass Field"},
  {n:"Supore",h:62,l:"Silvergrass Field"},

  // Fixed-time bosses
  {n:"Clemantis",ft:["thursday 19:00", "Monday 11:30"],l:"Corrupted Basin"},
  {n:"Ringor",ft:["Saturday 17:00"],l:"Battlefield of Templar"},
  {n:"Roderick",ft:["Friday 19:00"],l:"Garbana 1"},
  {n:"Auraq",ft:["Friday 22:00","Wednesday 21:00"],l:"Garbana 2F"},
  {n:"Chaiflock",ft:["Saturday 22:00"],l:"Silvergrass Field"},
  {n:"Saphirus",ft:["Sunday 17:00","Tuesday 11:30"],l:"Crescent Lake"},
  {n:"Neutro",ft:["Tuesday 19:00","Thursday 11:30"],l:"Desert of Scream / Ulan"},
  {n:"Thymele",ft:["Monday 19:00","Wednesday 11:30"],l:"Twilight Hill"},
  {n:"Milavy",ft:["Saturday 15:00"],l:"Lower Tomb of Tyriosa 3F"},
  {n:"Benji",ft:["Sunday 21:00"],l:"Barbas"},
  {n:"Icaruthia",ft:["Tuesday 21:00","Friday 21:00"],l:"Kransia"},
  {n:"Motti",ft:["Wednesday 19:00","Saturday 19:00"],l:"Kransia"},
  {n:"Nevaeh",ft:["Sunday 22:00"],l:"Kransia"}
];
  const resetAllBtn = document.getElementById("resetAllBtn");

if(isAdmin && resetAllBtn){
  resetAllBtn.style.display="inline-block";
  resetAllBtn.onclick = async ()=>{
    if(!confirm("RESET ALL BOSSES?")) return;
    for(const b of bosses){
      await updateDoc(doc(db,"bosses",b.n),{lastKill:0});
    }
    alert("All bosses reset.");
  };
}

let data = {};


// Initialize Firestore for all bosses
bosses.forEach(async b=>{
  const ref = doc(db,"bosses",b.n);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{lastKill:0,ft:b.ft||[],h:b.h||0,l:b.l||"-"});
  }
  onSnapshot(ref,s=>{
    data[b.n]=s.data();
  });
});


  
// Timer logic
function parseTime(str){
  const [day,time] = str.split(" ");
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const now = new Date();
  const t = new Date(); t.setHours(...time.split(":").map(Number),0,0);
  let diff = (days.indexOf(day)-now.getDay()+7)%7;
  if(diff===0 && t<now) diff=7;
  t.setDate(now.getDate()+diff);
  return t;
}

function nextSpawn(b){
  // HOURLY BOSSES (unchanged)
  if(b.h){
    return (data[b.n]?.lastKill || 0) + b.h * 3600000;
  }

  // FIXED-TIME BOSSES (FIXED LOGIC)
  if(b.ft){
    const now = Date.now();

    // get all upcoming times
    const upcoming = b.ft
      .map(f => parseTime(f).getTime())
      .filter(t => t > now)
      .sort((a,b)=>a-b);

    // if naa pay upcoming this week
    if(upcoming.length) return upcoming[0];

    // else, get earliest next week
    const nextWeek = b.ft
      .map(f => parseTime(f).getTime() + 7*24*3600000)
      .sort((a,b)=>a-b);

    return nextWeek[0];
  }

  return Date.now();
}


  function timeUntilSpawn(b){
  return nextSpawn(b) - Date.now();
}

  
function getStatus(b){
  const diff = timeUntilSpawn(b);


  if(diff <= 0){
    return ["Alive","alive","#4caf50"]; // GREEN
  }

  if(diff <= ONE_HOUR){
    return ["Very Soon","very-soon","#ff5252"]; // RED (≤ 1h)
  }

  if(diff <= FOUR_HOURS){
    return ["Soon","soon","#ff9800"]; // ORANGE (≤ 4h)
  }

  if(diff <= TWENTY_FOUR_HOURS){
    return ["Today","today","#ffc107"]; // YELLOW (today)
  }

  return ["Scheduled","scheduled","#9e9e9e"]; // GRAY
}



function formatCountdown(b){
  const diff = nextSpawn(b)-Date.now();
  if(diff <=0) return "Alive";
  const h = Math.floor(diff/3600000);
  const m = Math.floor((diff%3600000)/60000);
  return `${h}h ${m}m`;
}

// Admin actions
window.killBoss=(bossName)=>{
  let input = prompt("Enter exact kill time (YYYY-MM-DD HH:MM) or leave blank for current time:");
  let time = Date.now();
  if(input){
    const d = new Date(input);
    if(!isNaN(d)) time = d.getTime();
  }
  updateDoc(doc(db,"bosses",bossName),{lastKill:time});
};

window.resetBoss=(bossName)=>{
  if(confirm("Reset boss last kill?")){
    updateDoc(doc(db,"bosses",bossName),{lastKill:0});
  }
};

// Search/filter
const searchInput=document.getElementById('search');
const filterSelect=document.getElementById('filter');
searchInput.addEventListener('input', render);
filterSelect.addEventListener('change', render);



  
  
// Render

  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
 
  const ONE_HOUR = 60 * 60 * 1000;
  const FOUR_HOURS = 4 * ONE_HOUR;
  const TWENTY_FOUR_HOURS = 24 * ONE_HOUR;
  
function isFixedBoss(b){
  return Array.isArray(b.ft) && b.ft.length > 0;
}

function isTodayFixedBoss(b){
  if(!isFixedBoss(b)) return false;
  const today = days[new Date().getDay()];
  return b.ft.some(f => f.startsWith(today));
}
  
function isKransiaBoss(b){
  return b.l === "Kransia";
}

function isFixedRespawnToday(b){
  if(!isFixedBoss(b)) return false;
  const today = days[new Date().getDay()];
  if(!b.ft.some(f => f.startsWith(today))) return false;

  // kinahanglan ≤ 24h nalang
  return timeUntilSpawn(b) > 0 && timeUntilSpawn(b) <= TWENTY_FOUR_HOURS;
}


function render(){
  const root = document.getElementById("list");
  root.innerHTML = "";

const todayFixed = [];
const dynamic = [];
const otherFixed = [];
const kransia = [];

bosses.forEach(b=>{
  if(isKransiaBoss(b)){
    kransia.push(b);
  }
  else if(isFixedRespawnToday(b)){
    todayFixed.push(b);
  }
  else if(isFixedBoss(b)){
    otherFixed.push(b);
  }
  else{
    dynamic.push(b);
  }
});


  const TWELVE_HOURS = 12 * 60 * 60 * 1000;

function sortByPriority(list){
  return list.sort((a,b)=>{
    const ta = timeUntilSpawn(a);
    const tb = timeUntilSpawn(b);

    const aSoon = ta > 0 && ta <= TWELVE_HOURS;
    const bSoon = tb > 0 && tb <= TWELVE_HOURS;

    if(aSoon && !bSoon) return -1;
    if(!aSoon && bSoon) return 1;

    return ta - tb; // soonest first
  });
}

if(todayFixed.length)
  root.appendChild(renderSection("FIXED RESPAWNS TODAY", sortByPriority(todayFixed)));

function sortDynamicBosses(list){
  return list.sort((a,b)=>{
    const ta = timeUntilSpawn(a);
    const tb = timeUntilSpawn(b);

    // Alive first
    if(ta <= 0 && tb > 0) return -1;
    if(tb <= 0 && ta > 0) return 1;

    // Almost respawning (within 24h)
    const aSoon = ta > 0 && ta <= TWENTY_FOUR_HOURS;
    const bSoon = tb > 0 && tb <= TWENTY_FOUR_HOURS;

    if(aSoon && !bSoon) return -1;
    if(!aSoon && bSoon) return 1;

    // Otherwise soonest first
    return ta - tb;
  });
}

  function sortKransia(list){
  const order = ["Motti","Icaruthia","Nevaeh"];
  return list.sort((a,b)=> order.indexOf(a.n) - order.indexOf(b.n));
}

if(dynamic.length)
  root.appendChild(
    renderSection("DYNAMIC BOSSES", sortDynamicBosses(dynamic))
  );


if(otherFixed.length)
  root.appendChild(renderSection("OTHER FIXED TIMER", sortByPriority(otherFixed)));


 if(kransia.length)
  root.appendChild(
    renderSection("KRANSIA", kransia)
  );
}

  function formatRespawnDate(ts){
  const d = new Date(ts);
  if(isNaN(d)) return "-";

  return d.toLocaleString(undefined,{
    month:"short",
    day:"numeric",
    weekday:"short",
    hour:"numeric",
    minute:"2-digit",
    hour12:true
  });
}

  function renderSection(title, list){
  const sec = document.createElement("div");
  sec.className = "section";

  sec.innerHTML = `
    <h2>${title}</h2>
    <div class="boss" style="font-size:12px;font-weight:600;color:#9aa0aa">
      <div>Boss</div>
      <div>Status</div>
      <div>Respawn</div>
      <div>Countdown</div>
      ${isAdmin ? "<div>Actions</div>" : ""}
    </div>
  `;

  list.forEach(b=>{
    const [t,cls,col] = getStatus(b);
    if(filterSelect.value && filterSelect.value !== t) return;
    if(searchInput.value && !b.n.toLowerCase().includes(searchInput.value.toLowerCase())) return;

    sec.innerHTML += `
      <div class="boss ${cls}">
        <div>
          <strong>👑 ${b.n}</strong>
          <small>${b.l}</small>
        </div>
        <div class="status">
          <span class="dot" style="background:${col}"></span>${t}
        </div>
        <div class="schedule">
  ${
    b.h
    ? `${formatRespawnDate(nextSpawn(b))} <span class="respawn-rule">· ⏳${b.h}h</span>`
    : `📌 ${formatRespawnDate(nextSpawn(b))}`
  }
</div>


        <div class="time">${formatCountdown(b)}</div>
        ${isAdmin ? `
        <div>
          <button onclick="killBoss('${b.n}')">Kill</button>
          <button onclick="resetBoss('${b.n}')">Reset</button>
        </div>` : ""}
      </div>
    `;
  });

  return sec;
}
render();


setInterval(render,1000);

  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const newWorker = reg.installing;
      newWorker.addEventListener("statechange", () => {
        if (
          newWorker.state === "installed" &&
          navigator.serviceWorker.controller
        ) {
          location.reload(); // 🔥 AUTO REFRESH
        }
      });
    });
  });
}

// === NETWORK STATUS INDICATOR ===
const net = document.getElementById("netStatus");

function updateNetwork(){
  if(!net) return;

  if(navigator.onLine){
    net.textContent = "ONLINE";
    net.className = "net online";
  }else{
    net.textContent = "OFFLINE";
    net.className = "net offline";
  }
}


window.addEventListener("online", updateNetwork);
window.addEventListener("offline", updateNetwork);
updateNetwork();

</script>
</body>
</html>
